plugins {
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = '2.0.0'
group = 'com.glennfo.portalium'

base {
    archivesName = 'portalium'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

runs {
    configureEach {
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        systemProperty 'neoforge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    server {}
}

dependencies {
    implementation "net.neoforged:neoforge:21.11.42"
}

tasks.register('deploy', Copy) {
    dependsOn build
    from(layout.buildDirectory.dir('libs')) {
        include "portalium-*.jar"
        exclude "*-sources.jar"
    }
    into '/home/glenn/Documents/curseforge/minecraft/Instances/1.21.11/mods'
}
